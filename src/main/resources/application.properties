spring.application.name=carddemo-java

# In-memory H2 database, rebuilt and re-seeded from carddemo/app/data/ASCII on every start.
spring.datasource.url=jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

carddemo.seed.enabled=true
carddemo.seed.location=classpath:carddemo-data/
